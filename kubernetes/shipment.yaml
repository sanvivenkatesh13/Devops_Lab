
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipment
  template:
    metadata:
      labels:
        app: shipment
    spec:
      containers:
        - name: shipment-api
          image: shipment-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-service
spec:
  type: ClusterIP
  selector:
    app: shipment
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
